name: Multi-Platform Build Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-matrix:
    name: Build on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: dhap.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: dhap
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: dhap

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.target }}-cargo-

      - name: Compile Release Workspace
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Verify CLI Binary Output
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            test -f "target/${{ matrix.target }}/release/dhap.exe"
          else
            test -f "target/${{ matrix.target }}/release/dhap"
          fi
