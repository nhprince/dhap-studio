name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-checks:
    name: Rust Quality & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up stable Rust toolchain
        uses: dtolnay/rust-toolchain@4dd515a4ecb3c2921b7fcf5a6a43ff8d49a377b2 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@0c9c47087f9e8a08c5b05612140a3ad89839352e # v4.0.2
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify Code Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter (-D warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --workspace --verbose

  frontend-checks:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22.x
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c421b43 # v4.0.4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: apps/studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Production Bundle Build
        run: npm run build
