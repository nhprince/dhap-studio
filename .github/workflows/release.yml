name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
        type: string
        default: '0.1.0'
      dry_run:
        description: 'Dry run execution (build and verify without publishing release)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  validate:
    name: Validate Tag & Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      is_dry_run: ${{ steps.dry.outputs.dry_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG_VER="${GITHUB_REF#refs/tags/v}"
            echo "version=${TAG_VER}" >> $GITHUB_OUTPUT
          fi

      - name: Check Dry Run
        id: dry
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dry_run=${{ github.event.inputs.dry_run }}" >> $GITHUB_OUTPUT
          else
            echo "dry_run=false" >> $GITHUB_OUTPUT
          fi

  build-artifacts:
    name: Build Artifacts (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: dhap.exe
            archive_name: dhap-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: dhap
            archive_name: dhap-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: dhap
            archive_name: dhap-macos-arm64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} -p dhap-cli

      - name: Package Binary Artifact
        shell: bash
        run: |
          mkdir -p release-pkg
          cp LICENSE release-pkg/
          cp docs/THIRD_PARTY_NOTICES.md release-pkg/
          
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/dhap.exe" release-pkg/
            cd release-pkg
            7z a "../${{ matrix.archive_name }}" *
            cd ..
          else
            cp "target/${{ matrix.target }}/release/dhap" release-pkg/
            cd release-pkg
            tar -czf "../${{ matrix.archive_name }}" *
            cd ..
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

  publish-draft:
    name: Publish Draft Release
    needs: [validate, build-artifacts]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts-staging

      - name: Generate Checksums (SHA-256)
        run: |
          mkdir -p dist
          find artifacts-staging -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Draft Release
        if: ${{ needs.validate.outputs.is_dry_run == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.validate.outputs.version }}" dist/* \
            --title "Dhap (ধাপ) v${{ needs.validate.outputs.version }}" \
            --notes "Dhap v${{ needs.validate.outputs.version }} release. Record once. Create the video and guide together." \
            --draft
